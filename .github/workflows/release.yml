name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build:ext
      - name: Source bundle (includes the lock agent)
        run: git archive --format=zip --prefix=focusgateway/ -o focusgateway-${GITHUB_REF_NAME}.zip HEAD
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            extension/dist/focusgateway-chromium-*.zip
            extension/dist/focusgateway-firefox-*.zip
            focusgateway-${{ github.ref_name }}.zip
