name: Bug report
description: Something does not work the way it should
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Found a way to get around a block or a security problem?** Please do not open a public issue. Use the private report described in SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
      placeholder: I created a Task-Gated window for 4 to 7 pm, finished the task at 5, but Instagram stayed blocked.
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations: { required: true }
  - type: dropdown
    id: part
    attributes:
      label: Which part?
      multiple: true
      options: [Website / dashboard, Browser extension, Lock agent, Study room, Habits, Not sure]
    validations: { required: true }
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 131, Firefox 133, Edge 131...
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS 15, Ubuntu 24.04...
  - type: input
    id: version
    attributes:
      label: Regimen version
      description: Shown in the extension's details page, or `regimen-agent status`.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Browser console errors, or `agent.log` from the agent data folder. Remove anything private.
      render: text
