<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blocked · FocusGateway</title>
  <link rel="icon" href="icons/icon-32.png" />
  <link rel="stylesheet" href="page.css" />
  <style>
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px;
      background: radial-gradient(1200px 600px at 20% 0%, color-mix(in srgb, var(--accent) 18%, transparent), transparent),
                  radial-gradient(900px 500px at 100% 100%, color-mix(in srgb, var(--warm) 20%, transparent), transparent), var(--bg); }
    main { width: min(560px, 100%); display: grid; gap: 16px; }
    h1 { font-size: clamp(26px, 5vw, 36px); line-height: 1.15; margin: 0; letter-spacing: -0.02em; }
    .domain { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--card); border: 1px solid var(--line); padding: 2px 8px; border-radius: 8px; }
    .reason { display: grid; gap: 8px; }
    .reason .row { display: flex; justify-content: space-between; gap: 12px; align-items: center; flex-wrap: wrap; }
    ul { margin: 6px 0 0; padding-left: 18px; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; }
    .quote { font-style: italic; }
    .logo { width: 44px; height: 44px; }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="icons/icon-128.png" alt="" />
    <h1 id="title">This one can wait.</h1>
    <p class="muted"><span class="domain" id="domain"></span> is blocked right now.</p>
    <section id="reasons" class="reason"></section>
    <p class="quote muted" id="quote"></p>
    <div class="actions">
      <a class="btn primary" id="dash" href="app/index.html#/tasks">Open my tasks</a>
      <a class="btn" id="room" href="app/index.html#/room">Go to the study room</a>
      <a class="btn ghost" id="failsafe" href="app/index.html#/" hidden>Failsafe…</a>
    </div>
  </main>
  <script src="blocked.js"></script>
</body>
</html>
